# FairyCurtain – copy to config.yaml and adjust.

device:
  transport: bleak            # bleak = own Bluetooth adapter | esp32 = via ESP32 bridge | fake = dry run
  address: null               # BLE MAC address (e.g. "AA:BB:CC:00:11:22"); null = scan by name
  name_prefix: "Hello Fairy-"
  adapter: null               # e.g. hci0 (bleak on Linux only)
  bridge_url: "http://192.168.1.60"   # only for transport: esp32
  pixel_encoder: diy          # diy = confirmed app protocol | legacy_* for experiments only
  send_init: true             # init sequence as sent by the app
  packet_delay: 0.03          # seconds between pixel packets
  max_fps: 0.4                # a DIY upload takes ~2.5 s, so animations are slow
  keepalive_interval: 30      # status request to keep the link alive (0 = off)

layout:                       # adjust after calibrating in the web editor
  width: 20
  height: 20
  order: column               # column = strands top to bottom | row
  serpentine: false
  flip_x: false
  flip_y: false

render:
  brightness: 0.5             # 0–1, default dimming for images/text
  gamma: 1.0
  font_path: null             # e.g. /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

api:
  host: 127.0.0.1             # loopback only; use 0.0.0.0 to expose on the network (then set api_key!)
  port: 8321
  api_key: null               # set a secret and send it in the X-API-Key header
  allowed_hosts: []           # without api_key, public domain names are refused as Host (anti DNS rebinding); IPs, "lan01", *.local and *.home.arpa are fine; add others (e.g. "nas.lan") here

mqtt:
  enabled: false
  host: 192.168.1.10
  port: 1883
  username: null
  password: null
  base_topic: fairycurtain
  discovery_prefix: homeassistant
  device_name: "LED curtain"

nowplaying:                   # show album art/artist whenever the track changes
  enabled: false
  source: http                # http | homeassistant | mqtt
  # --- http: polls a JSON endpoint of your own app or any music API
  url: http://music.local/api/now-playing
  interval: 5
  paths:                      # paths into the JSON, e.g. "track.cover_url" or "items[0].image"
    title: title
    artist: artist
    image: image
    playing: null             # optional: path to "playing"/true
  # --- homeassistant: a media_player (Spotify, Sonos, …) via the HA API
  # ha_url: http://192.168.1.10:8123
  # ha_token: <long-lived access token>
  # entity_id: media_player.living_room
  # --- mqtt: JSON messages on a topic (requires mqtt.enabled)
  # topic: music/nowplaying
  show: cover                 # cover | text | both (artist/title first, then the cover)
  text_seconds: 6
  fit: cover
  movement: still             # e.g. loop_left to make the cover scroll
  idle: keep                  # keep | off | clear  when nothing is playing
  brightness: 1.0

log_level: INFO
