# FairyCurtain – kopieer naar config.yaml en pas aan.

device:
  transport: bleak            # bleak = eigen Bluetooth-adapter | esp32 = via ESP32-bridge | fake = droog testen
  address: null               # BLE MAC-adres (bv. "BE:29:FC:00:0B:09"); null = scannen op naam
  name_prefix: "Hello Fairy-"
  adapter: null               # bv. hci0 (alleen bleak op Linux)
  bridge_url: "http://192.168.1.60"   # alleen bij transport: esp32
  pixel_encoder: diy          # diy = bevestigd app-protocol | legacy_* alleen voor experimenten
  send_init: true             # init-reeks zoals de app die stuurt
  packet_delay: 0.03          # seconden tussen pixel-pakketten
  max_fps: 0.4                # een DIY-upload kost ~2,5 s; animaties zijn dus traag
  keepalive_interval: 30      # statusvraag om de link wakker te houden (0 = uit)

layout:                       # pas aan na kalibratie in de webeditor
  width: 20
  height: 20
  order: column               # column = slierten van boven naar beneden | row
  serpentine: false
  flip_x: false
  flip_y: false

render:
  brightness: 0.5             # 0–1, standaard-dimming voor plaatjes/tekst
  gamma: 1.0
  font_path: null             # bv. /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

api:
  host: 0.0.0.0
  port: 8321
  api_key: null               # zet een geheim en stuur header X-API-Key

mqtt:
  enabled: false
  host: 192.168.1.10
  port: 1883
  username: null
  password: null
  base_topic: fairycurtain
  discovery_prefix: homeassistant
  device_name: "LED-gordijn"

nowplaying:                   # albumhoes/artiest tonen zodra het nummer wisselt
  enabled: false
  source: http                # http | homeassistant | mqtt
  # --- http: pollt een JSON-endpoint van je eigen app (RetroHead, HSS, …)
  url: http://retrohead.local/api/now-playing
  interval: 5
  paths:                      # paden in de JSON, bv. "track.cover_url" of "items[0].image"
    title: title
    artist: artist
    image: image
    playing: null             # optioneel: pad naar "playing"/true
  # --- homeassistant: een media_player (Spotify, Sonos, …) via de HA-API
  # ha_url: http://192.168.178.10:8123
  # ha_token: <long-lived access token>
  # entity_id: media_player.woonkamer
  # --- mqtt: JSON-berichten op een topic (vereist mqtt.enabled)
  # topic: retrohead/nowplaying
  show: cover                 # cover | text | both (eerst artiest/titel, dan de hoes)
  text_seconds: 6
  fit: cover
  movement: still             # bv. loop_left om de hoes te laten schuiven
  idle: keep                  # keep | off | clear  als er niets speelt
  brightness: 1.0

log_level: INFO
