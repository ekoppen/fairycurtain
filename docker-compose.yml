# FairyCurtain
#
# Default: via the ESP32 bridge (transport: esp32). Works anywhere, including Mac/Windows.
services:
  fairycurtain:
    build: .
    container_name: fairycurtain
    restart: unless-stopped
    ports:
      - "8321:8321"
    volumes:
      - ./config.yaml:/config/config.yaml
    # environment:
    #   FAIRY_API_KEY: change-me

# Alternative for transport: bleak (own Bluetooth adapter, Linux host only):
# replace `ports:` with `network_mode: host`, and add:
#     volumes:
#       - /var/run/dbus:/var/run/dbus:ro
#     cap_add: [NET_ADMIN, NET_RAW]
