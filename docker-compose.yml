# FairyCurtain
#
# Standaard: via de ESP32-bridge (transport: esp32). Werkt overal, ook op Mac/Windows.
services:
  fairycurtain:
    build: .
    container_name: fairycurtain
    restart: unless-stopped
    ports:
      - "8321:8321"
    volumes:
      - ./config.yaml:/config/config.yaml
    # environment:
    #   FAIRY_API_KEY: geheim

# Alternatief voor transport: bleak (eigen Bluetooth-adapter, alleen Linux-host):
# vervang `ports:` door `network_mode: host`, en voeg toe:
#     volumes:
#       - /var/run/dbus:/var/run/dbus:ro
#     cap_add: [NET_ADMIN, NET_RAW]
