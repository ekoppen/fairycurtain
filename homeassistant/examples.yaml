# Home Assistant examples.
# With MQTT enabled the curtain shows up automatically as light.led_curtain
# (+ text.led_curtain_text and button.led_curtain_stop_animation).
# The REST commands below also work without MQTT.
# Replace 192.168.1.50 with the host running FairyCurtain.

rest_command:
  curtain_text:
    url: "http://192.168.1.50:8321/api/text"
    method: post
    content_type: application/json
    # headers: { X-API-Key: your-secret }
    payload: '{"text": "{{ text }}", "color": "{{ color | default(''#ffffff'') }}", "speed": {{ speed | default(12) }}}'
  curtain_image_base64:
    url: "http://192.168.1.50:8321/api/image/base64"
    method: post
    content_type: application/json
    payload: '{"data": "{{ data }}", "fit": "cover"}'
  curtain_preset:
    url: "http://192.168.1.50:8321/api/preset"
    method: post
    content_type: application/json
    payload: '{"preset": {{ preset }}, "brightness": {{ brightness | default(60) }}}'
  curtain_off:
    url: "http://192.168.1.50:8321/api/power"
    method: post
    content_type: application/json
    payload: '{"on": false}'

automation:
  - alias: "Curtain: Halloween preset at sunset"
    trigger: { platform: sun, event: sunset }
    action:
      - service: rest_command.curtain_preset
        data: { preset: 20, brightness: 60 }

  - alias: "Curtain: doorbell shows text"
    trigger: { platform: state, entity_id: binary_sensor.doorbell, to: "on" }
    action:
      - service: mqtt.publish
        data:
          topic: fairycurtain/cmd/text
          payload: '{"text": "DING DONG", "color": "#ffcc00", "speed": 18, "loop": false}'

  - alias: "Curtain: show picture via MQTT (from URL)"
    trigger: { platform: state, entity_id: input_boolean.party_mode, to: "on" }
    action:
      - service: mqtt.publish
        data:
          topic: fairycurtain/cmd/image
          payload: '{"url": "http://192.168.1.50:8123/local/pumpkin.gif", "brightness": 0.4}'

  - alias: "Curtain: off at night"
    trigger: { platform: time, at: "23:30:00" }
    action:
      - service: light.turn_off
        target: { entity_id: light.led_curtain }
